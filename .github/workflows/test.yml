name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: make test
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install numpy && pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: cd python && python compare_torch.py
